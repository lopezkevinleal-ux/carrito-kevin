<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 30px;">

    <h1>Detalle del Producto</h1>

    <div id="detalleProducto">
        <p>Cargando información del producto...</p>
    </div>

    <br>
    <a href="index.html">← Volver al listado</a>

    <script src="script.js"></script>
    <script>
        async function pintarDetalle() {
            const params = new URLSearchParams(document.location.search);
            const id = params.get("id");
            const contenedor = document.getElementById("detalleProducto");

            if (!id) {
                contenedor.innerHTML = "<p>No se especificó ningún producto.</p>";
                return;
            }

            try {
                const producto = await productoPorId(id);

                contenedor.innerHTML = `
                    <div style="border: 1px solid #ccc; border-radius: 8px; padding: 20px; width: 300px; font-family: Arial, sans-serif; box-shadow: 2px 2px 5px rgba(0,0,0,0.1);">
                        <h2>${producto.nombre}</h2>
                        <p><strong>ID:</strong> ${producto.id}</p>
                        <p><strong>Precio:</strong> $${producto.precio}</p>
                        <p><strong>Stock disponible:</strong> ${producto.stock}</p>
                    </div>
                `;
            } catch (error) {
                contenedor.innerHTML = "<p>Producto no encontrado o error de conexión.</p>";
            }
        }

        pintarDetalle();
    </script>

</body>
</html>
